/* ── 降下シーケンス ─────────────────────────── */
function startDescend(obj, isSat){
  buildSurface(obj, isSat);
  MODE = 'descend';
  G.desc = { t:0, dur:6.4, drift:0 };
  $('hud').hidden = true; $('descend').hidden = false;
  $('dsPhase').textContent = (isSat? obj.name : obj.name) + ' 降下シーケンス';
  Audio2.noise(1.2, 0.05);
}
function updDescend(dt){
  const d = G.desc; d.t += dt;
  const p = clamp(d.t/d.dur, 0, 1), e = p*p*(3-2*p);
  d.drift = clamp(d.drift + IN.side*dt*9, -22, 22);
  const alt = lerp(300, 0, e);
  const px = G.pl.x + d.drift*(1-e), pz = G.pl.z;
  const gy = heightAt(px,pz);
  camera.position.set(px, gy + 2.6 + alt, pz + 9 + alt*0.5);
  camera.lookAt(px, gy + 1.4 + alt*0.22, pz);
  if(G.lander){
    G.lander.position.set(px, gy + 1.6 + alt*0.98, pz);
    G.lander.rotation.set(lerp(-0.5,0,e), 0.9, 0);
    if(G.lander.userData.flame){ G.lander.userData.flame.visible = p<0.99;
      const s = 2.6+Math.sin(T*30)*0.4; G.lander.userData.flame.scale.set(s,s,1); }
  }
  if(G.player) G.player.visible = p>0.985;
  const vel = Math.round((1-e)*430 + 4);
  $('dsStat').innerHTML = '高度 <b>'+Math.round(alt*14).toLocaleString()+' m</b> ・ 降下速度 <b>'+vel+' m/s</b>'
    + '<br>A / D で着地点をずらせる';
  if(p>=1){
    $('descend').hidden = true; $('hud').hidden = false;
    G.pl.x = px; G.pl.y = gy; G.player.position.set(px,gy,pz); G.player.visible = true;
    MODE = 'surface';
    Audio2.noise(0.6, 0.14); Audio2.chord([330,392,494]);
    const o = G.obj;
    if(mark(o.id+':land')){
      toast('着陸', o.name+' に着陸', 'ソフト着陸。脚に異常なし。ここから歩ける。', false);
    } else toast('着陸', o.name+' に再着陸', '記録の続きを埋めよう', true);
    updMapPct(); checkComplete();
  }
}

/* ── 地表の更新 ─────────────────────────────── */
function updSurface(dt){
  const pl = G.pl, cfg = G.cfg;
  // 視点（ドラッグ／矢印で回す）
  const yaw = IN.look.x, pitch = IN.look.y;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const spd = G.rover? 21 : 8.4;
  const wantX = (fx*IN.fwd + rx*IN.side)*spd;
  const wantZ = (fz*IN.fwd + rz*IN.side)*spd;
  const accel = pl.ground? 9.5 : 2.2;
  pl.vx = lerp(pl.vx, wantX, clamp(dt*accel,0,1));
  pl.vz = lerp(pl.vz, wantZ, clamp(dt*accel,0,1));
  pl.x += pl.vx*dt; pl.z += pl.vz*dt;
  // 境界
  const rr = Math.hypot(pl.x,pl.z);
  if(rr>215){ const k=215/rr; pl.x*=k; pl.z*=k; pl.vx*=0.4; pl.vz*=0.4;
    if(!G.edge || T-G.edge>5){ G.edge=T; toast('航法','ここから先は未踏査域','船の周りを探索しよう',true);} }
  // 重力
  const gy = heightAt(pl.x, pl.z);
  pl.vy -= G.grav*dt;
  pl.y += pl.vy*dt;
  if(pl.y <= gy){
    if(!pl.ground && pl.vy < -8) Audio2.noise(0.18, 0.05);
    pl.y = gy; pl.vy = 0; pl.ground = true;
  } else pl.ground = false;
  if(IN.jump && pl.ground){
    pl.vy = 5.4 + G.grav*0.46; pl.ground=false; IN.jump=false;
    Audio2.blip(180+G.grav*8, 0.14, 'triangle');
  }
  // 姿勢
  const moving = Math.hypot(pl.vx,pl.vz);
  if(moving>0.6){ const want = Math.atan2(pl.vx, pl.vz);
    let dA = want - pl.face; while(dA>Math.PI) dA-=TAU; while(dA<-Math.PI) dA+=TAU;
    pl.face += dA*clamp(dt*7,0,1); }
  G.player.position.set(pl.x, pl.y, pl.z);
  G.player.rotation.y = pl.face;
  // 接地に合わせて少し傾ける
  const hL = heightAt(pl.x-1.2, pl.z), hR = heightAt(pl.x+1.2, pl.z);
  G.player.rotation.z = clamp((hL-hR)*0.2, -0.3, 0.3);
  if(G.rover && G.player.userData.wheels){
    const s = moving*dt*1.6;
    G.player.userData.wheels.forEach(w=>{ w.rotation.x += s; });
  } else if(G.player.userData.legs){
    const t = Math.sin(T*(6+moving*0.5))*clamp(moving*0.09,0,0.5);
    G.player.userData.legs.forEach((l,i)=>{ l.rotation.x = t*(i%2?1:-1); });
  }
  // カメラ
  const dist = IN.zoom * (G.rover?1.25:1);
  const cx = pl.x - fx*dist*Math.cos(pitch), cz = pl.z - fz*dist*Math.cos(pitch);
  const cy = pl.y + 2.2 + dist*Math.sin(pitch)+0.8;
  const ground = heightAt(cx,cz)+1.2;
  camera.position.lerp(new THREE.Vector3(cx, Math.max(cy,ground), cz), clamp(dt*7,0,1));
  camera.lookAt(pl.x, pl.y+1.7, pl.z);
  // 発見判定
  let near=null, nd=1e9;
  for(const m of G.finds){
    m.rotation.z += dt*0.7;
    const dd = m.userData.ground.distanceTo(G.player.position);
    if(dd<nd){ nd=dd; near=m; }
    m.userData.glow.material.opacity = (m.userData.done?0.3:0.55)+Math.sin(T*2.2+m.position.x)*0.12;
  }
  G.nearFind = (near && nd<8.5 && !near.userData.done) ? near : null;
  if(near && nd<26) showLabel(near.userData.ground.clone().setY(near.userData.ground.y+7),
    (near.userData.done?'記録済 ':'') + near.userData.rec.n + (G.nearFind? ' ［E］':''));
  else hideLabel();
  // HUD
  const o = G.obj, all = (o.finds||[]).length, got = (o.finds||[]).filter(f=>has(o.id+':'+f.k)).length;
  hud({ t:'SURFACE ─ 地表', l1:'天体', v1:o.name,
    l2:'重力', v2:(G.grav/21).toFixed(2)+' G',
    l3:'発見', v3:got+' / '+all, bar: all? got/all*100 : 100 });
  const acts = [];
  if(G.nearFind) acts.push({l:'記録する', k:'E', f:()=>act('record')});
  acts.push({l:'撮影', k:'P', f:()=>act('shoot')});
  acts.push({l:'船に戻る', k:'', f:()=>enterOrbit(CUR)});
  setActions(acts);
  setHint('<b>WASD</b> 移動 ・ <b>SPACE</b> ジャンプ ・ <b>ドラッグ</b> 視点 ・ <b>E</b> 記録 ・ <b>P</b> 撮影'
    + (G.skyShot? ' ── <b style="color:var(--amber)">空に見えるものを撮ってみる</b>':''));
}
/* ===========================================================
   UI と進行 — 星図・日誌・計器
   =========================================================== */
function bodyScore(b){
  let got=0, total=0;
  const add = k => { total++; if(has(k)) got++; };
  add(b.id+':reach');
  (b.obs||[]).forEach(o=>add(b.id+':'+o.k));
  if(b.surf){ add(b.id+':land'); (b.finds||[]).forEach(f=>add(b.id+':'+f.k)); }
  if(b.sat){ add(b.sat.id+':land'); (b.sat.finds||[]).forEach(f=>add(b.sat.id+':'+f.k)); }
  return {got, total};
}
function totalScore(){
  let g=0,t=0; BODIES.forEach(b=>{ const s=bodyScore(b); g+=s.got; t+=s.total; });
  return { got:g, total:t, pct: t? Math.round(g/t*100):0 };
}
function updMapPct(){
  const s = totalScore();
  $('mapPct').textContent = s.pct+'%';
  $('logPct').textContent = s.pct+'%';
  $('logSub').textContent = s.got+' / '+s.total+' 項目・写真 '+SAVE.photos.length+' 枚';
  if(!$('map').hidden) renderRail();
}

/* ── 計器表示 ─────────────────────────────── */
function hudMode(m){
  $('hud').hidden = false; $('title').hidden = true; $('map').hidden = true;
  $('reticle').style.display = (m==='surface')? 'none':'block';
}
let hintCache='';
function setHint(html){ if(html===hintCache) return; hintCache=html; $('hint').innerHTML=html; }
let hudCache='';
function hud(o){
  const sig = o.t+o.l1+o.v1+o.l2+o.v2+o.l3+o.v3+Math.round(o.bar);
  if(sig===hudCache) return; hudCache=sig;
  $('navTitle').textContent = o.t;
  $('nl1').textContent=o.l1; $('nv1').textContent=o.v1;
  $('nl2').textContent=o.l2; $('nv2').textContent=o.v2;
  $('nl3').textContent=o.l3; $('nv3').textContent=o.v3;
  $('barI').style.width = clamp(o.bar,0,100)+'%';
}
let actSig = '';
function setActions(list){
  const sig = list.map(a=>a.l).join('|');
  if(sig===actSig) return; actSig = sig;
  const host = $('action'); host.innerHTML='';
  list.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'btn' + (a.k==='E'||a.k==='L' ? ' primary':'');
    b.innerHTML = a.l + (a.k? ' <span style="opacity:.6;font-family:var(--mono);font-size:11px">['+a.k+']</span>':'');
    b.addEventListener('click', ()=>{ a.f(); b.blur(); });
    host.appendChild(b);
  });
}
function toast(kind, name, text, dim){
  const host = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast'+(dim?' dim':'');
  el.innerHTML = '<div class="k">'+esc(kind)+'</div><div class="n">'+esc(name)+'</div>'
    + (text? '<div class="d">'+esc(text)+'</div>':'');
  host.appendChild(el);
  while(host.children.length>3) host.removeChild(host.firstChild);
  setTimeout(()=>{ el.style.transition='opacity .5s,transform .5s'; el.style.opacity='0'; el.style.transform='translateX(20px)';
    setTimeout(()=>el.remove(), 520); }, dim? 2600:5600);
}

/* ── 星図 ─────────────────────────────────── */
let SEL = 'moon';
function renderRail(){
  const rail = $('rail'); rail.innerHTML='';
  ROUTE.forEach((id,i)=>{
    const b = BY_ID[id], s = bodyScore(b);
    const btn = document.createElement('button');
    btn.className='stop'; btn.setAttribute('aria-current', id===SEL? 'true':'false');
    const size = clamp(Math.round(b.rad*0.075)+9, 11, 30);
    const done = s.got>=s.total;
    btn.innerHTML =
      '<div class="pct">'+(s.got? Math.round(s.got/s.total*100)+'%':'')+'</div>'
      + '<div class="dot" style="width:'+size+'px;height:'+size+'px;background:#'+new THREE.Color(b.color).getHexString()
      + (done?';box-shadow:0 0 0 2px var(--verdi),0 0 18px rgba(87,168,151,.5)':'')+'"></div>'
      + '<div class="tick"></div>'
      + '<div class="lbl">'+b.name+'</div>';
    btn.style.paddingLeft = (i===0?0:Math.min(10+i*4,34))+'px';
    btn.addEventListener('click', ()=>{ SEL=id; renderRail(); renderDetail(); });
    rail.appendChild(btn);
  });
}
function renderDetail(){
  const b = BY_ID[SEL], s = bodyScore(b);
  $('dKana').textContent = b.kana;
  $('dName').textContent = b.name;
  $('dMission').textContent = b.mission;
  const play = b.type==='giant' ? '周回観測 ＋ '+b.sat.name+'に着陸'
             : b.type==='star' ? '安全距離からの観測のみ'
             : b.type==='port' ? '宇宙港を探索 ＋ 軌道から地球を撮る'
             : (b.rover? '探査車で走行 ＋ 発見':'低重力で歩行 ＋ 発見');
  $('dStats').innerHTML =
      '<dt>太陽から</dt><dd>'+b.au+'</dd>'
    + '<dt>重力</dt><dd>'+b.grav+'</dd>'
    + '<dt>航行距離</dt><dd>'+(b.cruise/100).toFixed(0)+' 光分（ゲーム内縮尺）</dd>'
    + '<dt>遊び方</dt><dd style="font-family:var(--ui)">'+play+'</dd>'
    + '<dt>記録</dt><dd>'+s.got+' / '+s.total+'</dd>';
  const st = $('dStamp');
  if(s.got>=s.total){ st.className='stamp on'; st.textContent='記録完了'; }
  else if(has(b.id+':reach')){ st.className='stamp on'; st.textContent='到達済み'; }
  else { st.className='stamp off'; st.textContent='未到達'; }
  $('btnGo').textContent = has(b.id+':reach') ? b.name+'へ再訪' : b.name+'へ出発';
}
function openMap(){
  if(MODE!=='attract') buildAttract();
  $('hud').hidden=true; $('title').hidden=true; $('descend').hidden=true; $('map').hidden=false;
  hideLabel(); actSig=''; $('action').innerHTML='';
  renderRail(); renderDetail(); updMapPct();
}

/* ── 航海日誌 ─────────────────────────────── */
function toggleLog(){
  const l = $('log');
  if(l.hidden){ renderLog(); l.hidden=false; } else l.hidden=true;
}
function renderLog(){
  const host = $('logEntries'); host.innerHTML='';
  ROUTE.forEach(id=>{
    const b = BY_ID[id], s = bodyScore(b);
    const e = document.createElement('div'); e.className='entry';
    let items = '';
    const row = (k, label, text, tag) => {
      const on = has(k);
      items += '<li class="'+(on?'':'un')+'"><span class="mk">'+(on?'✓':'—')+'</span><span>'
        + (on? '<b>'+label+'</b>'+(text? '<br>'+text:'') : '<span>'+(tag||'未記入')+'</span>')+'</span></li>';
    };
    row(b.id+':reach','到達','','未到達');
    (b.obs||[]).forEach(o=>row(b.id+':'+o.k, o.n, o.t));
    if(b.surf){ row(b.id+':land','着陸','','未着陸'); (b.finds||[]).forEach(f=>row(b.id+':'+f.k, f.n, f.t)); }
    if(b.sat){ row(b.sat.id+':land', b.sat.name+'に着陸','','未着陸');
      (b.sat.finds||[]).forEach(f=>row(b.sat.id+':'+f.k, f.n, f.t)); }
    e.innerHTML = '<div class="eh"><h4>'+b.name+'</h4><div class="st">'+s.got+' / '+s.total+'</div></div><ul>'+items+'</ul>';
    host.appendChild(e);
  });
  const sh = $('logShots');
  if(SAVE.photos.length){
    sh.hidden=false;
    sh.innerHTML = SAVE.photos.map(p=>{
      const src = (typeof p.u==='string' && p.u.indexOf('data:image/')===0) ? p.u : '';
      if(!src) return '';
      return '<div class="shotwrap"><img src="'+src+'" alt="'+esc(p.n)+'で撮影した写真"><span>'+esc(p.n)+' ・ '+esc(p.d)+'</span></div>';
    }).join('');
  } else sh.hidden = true;
}

/* ── 起動 ─────────────────────────────────── */
function startEngine(){
  try{
    if(!window.THREE){
      $('loadMsg').textContent = '描画機関を読み込めなかった。再読み込みを。';
      return;
    }
    initEngine();
    buildAttract();
    $('loading').hidden = true;
    $('title').hidden = false;
    updMapPct();
  }catch(err){
    $('loadMsg').textContent = '起動に失敗した：'+(err&&err.message? err.message:'原因不明');
    console.error(err);
  }
}
function boot(){
  loadSave();
  if(loadMute()) Audio2.on = false;
  syncMuteBtn();
  let errShown = false;
  window.addEventListener('error', function(ev){
    if(errShown) return; errShown = true;
    const m = (ev && ev.message) ? ev.message : '不明なエラー';
    const ld = $('loading');
    if(ld && !ld.hidden) $('loadMsg').textContent = '起動に失敗した：' + m;
    else { try{ toast('不具合', 'エラーが出た', m, false); }catch(e){} }
  });
  startEngine();
  const bindTapBtn = (id, fn) => {
    const el = $(id); if(!el) return;
    el.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      el.classList.add('pressed');
      if(navigator.vibrate) navigator.vibrate(15);
      unlockAudio();
      fn(e);
    }, {passive:false});
    const up = ()=>el.classList.remove('pressed');
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  };
  bindTapBtn('btnStart', ()=>{ Audio2.init(); Audio2.ambience(58,0.055); openMap(); });
  bindTapBtn('btnLog0', toggleLog);
  bindTapBtn('btnLog1', toggleLog);
  bindTapBtn('btnLog2', toggleLog);
  bindTapBtn('btnLogX', toggleLog);
  bindTapBtn('btnMap2', openMap);
  bindTapBtn('btnGo', ()=>{
    Audio2.init();
    $('map').hidden = true;
    startCruise(SEL);
  });
  $('log').addEventListener('click', e=>{ if(e.target===$('log')) toggleLog(); });
}
boot();

</script>
